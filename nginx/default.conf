# Configuracion de nginx para la landing DGE | EDUTEC (sitio estatico).
# Nota: las directivas `add_header` de este nivel se heredan en los `location`
# de abajo porque ninguno de ellos define su propio `add_header`.

server {
    # Solo IPv4: en hosts Docker sin IPv6 un `listen [::]:80` hace que
    # nginx aborte al arrancar. Traefik/Dokploy llega por la red interna IPv4.
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # UTF-8 explicito: el sitio esta en espanol (acentos y enies).
    charset       utf-8;
    charset_types text/css text/html text/plain text/xml
                  application/javascript application/json image/svg+xml;

    # --- Compresion ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml application/xml;

    # --- Cabeceras de seguridad (heredadas por los location) ---
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Oculta la version de nginx en las respuestas
    server_tokens off;

    # --- Health check (lo usa Docker/Dokploy para saber si el contenedor vive) ---
    location = /health {
        access_log   off;
        default_type text/plain;
        return 200   "ok\n";
    }

    # --- Cache de assets ---
    # El HTML cambia en cada deploy: no se cachea.
    location = /index.html {
        expires -1;
    }

    # CSS y JS: se editan seguido, cache corta.
    location ~* \.(?:css|js)$ {
        expires 7d;
    }

    # Imagenes y fuentes: cache larga.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        expires 30d;
    }

    # --- Contenido ---
    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquea archivos ocultos (.git, .env, etc.) por si alguno se cuela.
    location ~ /\. {
        deny all;
    }
}
