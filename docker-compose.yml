# Alternativa al tipo "Application": desplegar como servicio Docker Compose.
# En Dokploy: Create Service -> Compose, y en Domains elegir el servicio
# "landing" con puerto 80.
#
# Para el tipo "Application" (recomendado) este archivo NO se usa: alcanza
# con el Dockerfile.

services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# Red que crea Dokploy al instalarse; por ella entra Traefik al contenedor.
networks:
  dokploy-network:
    external: true
